name: Windows package

# ساخت بسته‌ی ویندوز (نصب‌کننده‌ی EXE + نسخه‌ی قابل‌حمل ZIP) روی رانر ویندوزی گیت‌هاب.
#
# - با هر push روی شاخه‌های arena/** یا main، بسته ساخته می‌شود و به‌عنوان Artifact
#   قابل دانلود است (تب Actions → همان اجرا → بخش Artifacts).
# - با push تگ v* (مثلاً v1.0.0) یا اجرای دستی با publish=true، فایل‌ها به
#   GitHub Releases هم منتشر می‌شوند تا با یک کلیک نصب شوند.

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "نسخه‌ی بسته (مثلاً 1.0.0)"
        required: false
        default: "1.0.0"
      publish:
        description: "انتشار در GitHub Releases"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint · Typecheck · Unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
            else { $version = "1.0.0" }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Package version: $version"

      - name: Build packages (portable + installer)
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -Version "${{ steps.version.outputs.value }}" -AutoInstallInno -SkipChecks

      - name: Show outputs
        shell: pwsh
        run: Get-ChildItem packaging/windows/dist -File | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-windows-${{ steps.version.outputs.value }}
          path: |
            packaging/windows/dist/*.exe
            packaging/windows/dist/*.zip
            packaging/windows/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          Write-Host "Publishing $tag"
          $exists = $false
          try { gh release view $tag | Out-Null; $exists = $true } catch { $exists = $false }
          if (-not $exists) {
            gh release create $tag --title "یوتیوب دانلودر ${{ steps.version.outputs.value }}" --notes @"
          بسته‌ی ویندوز «یوتیوب دانلودر»

          - **YouTubeDownloader-Setup-${{ steps.version.outputs.value }}-x64.exe** — نصب‌کننده (بدون نیاز به دسترسی مدیر)
          - **YouTubeDownloader-Portable-${{ steps.version.outputs.value }}-x64.zip** — نسخه‌ی قابل‌حمل (بدون نصب)

          پس از نصب، از منوی استارت «یوتیوب دانلودر» را اجرا کنید؛ مرورگر خودکار باز می‌شود.
          "@
          }
          Get-ChildItem packaging/windows/dist -File -Include *.exe, *.zip, SHA256SUMS.txt |
            ForEach-Object { gh release upload $tag $_.FullName --clobber }
