name: Windows package

# ساخت بسته‌ی ویندوز (نصب‌کننده‌ی EXE + نسخه‌ی قابل‌حمل ZIP) روی رانر ویندوزی گیت‌هاب.
#
# - با هر push روی شاخه‌های main یا arena/**، بسته ساخته می‌شود و در تب Actions
#   (بخش Artifacts همان اجرا) قابل دانلود است.
# - با push تگ v* (مثلاً v1.0.0) یا اجرای دستی با publish=true، فایل‌ها به
#   GitHub Releases منتشر می‌شوند تا کاربران با یک کلیک دانلود و نصب کنند.

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "نسخه‌ی بسته (مثلاً 1.0.0)"
        required: false
        default: "1.0.0"
      publish:
        description: "انتشار در GitHub Releases"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
            else { $version = "1.0.0" }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Package version: $version"

      - name: Build packages
        id: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/dist | Out-Null
          $log = "packaging/windows/dist/build.log"
          & ./packaging/windows/build.ps1 -Version "${{ steps.version.outputs.value }}" -AutoInstallInno -SkipChecks *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          Write-Host "build.ps1 exit code: $code"
          if ($code -ne 0) { throw "build.ps1 failed with exit code $code" }

      - name: Show outputs
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows/dist -File |
            Select-Object Name, @{ n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } |
            Format-Table -AutoSize

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: packaging/windows/dist/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer and portable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-windows-${{ steps.version.outputs.value }}
          path: |
            packaging/windows/dist/*.exe
            packaging/windows/dist/*.zip
            packaging/windows/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # در صورت خرابی، انتهای لاگ ساخت در Issue شماره ۲ ثبت می‌شود تا عیب‌یابی ساده باشد.
      - name: Report build failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = "packaging/windows/dist/build.log"
          if (Test-Path $log) {
            $tail = (Get-Content $log -Tail 80) -join [Environment]::NewLine
          } else {
            $tail = "(build log not found)"
          }
          Set-Content -Path build-failure.log -Value $tail -Encoding UTF8
          gh issue comment 2 --repo ${{ github.repository }} --body-file build-failure.log

      - name: Publish GitHub release
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $version = "${{ steps.version.outputs.value }}"
          Write-Host "Publishing $tag"
          $previous = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          & gh release view $tag | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previous
          if (-not $exists) {
            $notes = "بسته‌ی ویندوز «یوتیوب دانلودر» نسخه $version" +
              [Environment]::NewLine + [Environment]::NewLine +
              "فایل Setup نصب‌کننده‌ی ویندوز است (بدون نیاز به دسترسی مدیر) و فایل Portable بدون نصب اجرا می‌شود." +
              [Environment]::NewLine +
              "پس از نصب، از منوی استارت «یوتیوب دانلودر» را اجرا کنید؛ مرورگر خودکار باز می‌شود."
            $notes | Out-File -FilePath release-notes.md -Encoding utf8
            & gh release create $tag --title "یوتیوب دانلودر $version" --notes-file release-notes.md
          }
          Get-ChildItem packaging/windows/dist -File -Include *.exe, *.zip, SHA256SUMS.txt |
            ForEach-Object { & gh release upload $tag $_.FullName --clobber }
