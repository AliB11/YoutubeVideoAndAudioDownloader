name: Windows package

# ساخت بسته‌ی ویندوز (نصب‌کننده‌ی EXE + نسخه‌ی قابل‌حمل ZIP) روی رانر ویندوزی گیت‌هاب.
#
# - با هر push روی شاخه‌های main یا arena/**، بسته ساخته می‌شود و در تب Actions
#   (بخش Artifacts همان اجرا) قابل دانلود است.
# - با push تگ v* (مثلاً v1.0.0) یا اجرای دستی با publish=true، فایل‌ها به
#   GitHub Releases منتشر می‌شوند تا کاربران با یک کلیک دانلود و نصب کنند.
# - در صورت خرابی، انتهای لاگ ساخت در Issue شماره ۲ و شاخه‌ی ci-logs ثبت می‌شود
#   تا عیب‌یابی بدون دسترسی به لاگ Actions ممکن باشد.

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "نسخه‌ی بسته (مثلاً 1.0.0)"
        required: false
        default: "1.0.0"
      publish:
        description: "انتشار در GitHub Releases"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
            else { $version = "1.0.0" }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Package version: $version"

      - name: Build packages
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path packaging/windows/dist | Out-Null
          $log = "packaging/windows/dist/build.log"
          "=== build started: $(Get-Date -Format s) ===" | Set-Content -Path $log -Encoding UTF8
          $code = 0
          try {
            & ./packaging/windows/build.ps1 -Version "${{ steps.version.outputs.value }}" -AutoInstallInno -SkipChecks -ErrorAction Continue *>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
          } catch {
            $_ | Out-String | Add-Content -Path $log
            $code = 1
          }
          if ($null -eq $code) { $code = 0 }
          "=== build.ps1 exit code: $code ===" | Add-Content -Path $log
          Write-Host "build.ps1 exit code: $code"
          Write-Host "=== build log tail ==="
          Get-Content $log -Tail 60 | Write-Host
          if ($code -ne 0) { throw "build.ps1 failed with exit code $code" }

      - name: Show outputs
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows/dist -File |
            Select-Object Name, @{ n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } |
            Format-Table -AutoSize

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: packaging/windows/dist/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer and portable zip
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: youtube-downloader-windows-${{ steps.version.outputs.value }}
          path: |
            packaging/windows/dist/*.exe
            packaging/windows/dist/*.zip
            packaging/windows/dist/*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Report build failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $log = "packaging/windows/dist/build.log"
          New-Item -ItemType Directory -Force -Path ".ci" | Out-Null
          if (Test-Path $log) { Copy-Item $log ".ci/build-failure.log" -Force } else { "no build log" | Set-Content ".ci/build-failure.log" }
          "### failed run: ${{ github.run_id }} ($(Get-Date -Format s))" | Add-Content ".ci/build-failure.log"
          gh issue comment 2 --repo ${{ github.repository }} --body-file ".ci/build-failure.log"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -f ".ci/build-failure.log"
          git commit -m "ci: build failure log for run ${{ github.run_id }}"
          git push -f origin "HEAD:ci-logs"

      - name: Publish GitHub release
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $version = "${{ steps.version.outputs.value }}"
          Write-Host "Publishing $tag"
          $previous = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          & gh release view $tag | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previous
          if (-not $exists) {
            $notes = "بسته‌ی ویندوز «یوتیوب دانلودر» نسخه $version" + [Environment]::NewLine + [Environment]::NewLine +
              "**نصب:** فایل ``YouTubeDownloader-Setup-$version-x64.exe`` را دانلود و اجرا کنید (بدون نیاز به دسترسی مدیر و بدون هیچ پیش‌نیاز)." + [Environment]::NewLine +
              "**بدون نصب:** فایل ``YouTubeDownloader-Portable-$version-x64.zip`` را از حالت فشرده خارج کنید و ``Start-YouTubeDownloader.cmd`` را اجرا کنید." + [Environment]::NewLine + [Environment]::NewLine +
              "پس از اجرا، سرویس به‌صورت محلی روی ``http://127.0.0.1:3000`` بالا می‌آید و مرورگر خودکار باز می‌شود." + [Environment]::NewLine + [Environment]::NewLine +
              "بسته شامل Node.js، yt-dlp و ffmpeg است. ویندوز ممکن است پیام «Windows protected your PC» را نشان دهد؛ روی More info و سپس Run anyway کلیک کنید." + [Environment]::NewLine + [Environment]::NewLine
            $report = "packaging/windows/dist/BUILD-REPORT.txt"
            if (Test-Path $report) {
              $notes += "``````" + [Environment]::NewLine + (Get-Content $report -Raw) + "``````"
            }
            $notes | Out-File -FilePath release-notes.md -Encoding utf8
            & gh release create $tag --title "یوتیوب دانلودر $version" --notes-file release-notes.md --target ${{ github.sha }}
          }
          Get-ChildItem packaging/windows/dist -File -Include *.exe, *.zip, *.txt |
            ForEach-Object { & gh release upload $tag $_.FullName --clobber }
